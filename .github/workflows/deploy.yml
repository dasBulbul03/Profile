name: Build, Push and Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =====================================
  # 1. BUILD
  # =====================================
  build:
    name: 1. Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t bulbul03/my-portfolio:latest .

      - name: Save Docker image
        run: |
          docker save bulbul03/my-portfolio:latest \
            -o portfolio-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-image
          path: portfolio-image.tar


  # =====================================
  # 2. PUSH TO DOCKER HUB
  # =====================================
  push:
    name: 2. Push Image to Docker Hub
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: portfolio-image

      - name: Load Docker image
        run: |
          docker load -i portfolio-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push bulbul03/my-portfolio:latest


  # =====================================
  # 3. DEPLOY TO AWS EC2
  # =====================================
  deploy:
    name: 3. Deploy to AWS EC2
    needs: push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Compose file to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.yml"
          target: "~/portfolio"

      - name: Deploy portfolio on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/portfolio

            docker pull bulbul03/my-portfolio:latest

            docker compose down || true

            docker compose up -d

            docker image prune -f

            echo "Portfolio deployed successfully!"
